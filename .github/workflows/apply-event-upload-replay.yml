name: Apply tested event upload replay protection

on:
  push:
    branches: [feature/non-payment-forms-phases-2-4]
    paths: [.github/workflows/apply-event-upload-replay.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/non-payment-forms-phases-2-4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Patch route and focused test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          route = Path('src/app/api/events/[eventId]/register/route.ts')
          s = route.read_text()
          s = s.replace('''  type FormSubmissionAsset,
            validateProofBoundFormAssets,
            verifyFormUploadProof,
          } from "@/lib/forms/upload-proof";''', '''  type FormSubmissionAsset,
            hashFormUploadManifest,
            validateProofBoundFormAssets,
            verifyFormUploadProof,
          } from "@/lib/forms/upload-proof";
          import { consumeFormUploadSession } from "@/lib/forms/upload-sessions";''')
          s = s.replace('''      const proof = verifyFormUploadProof({
                  expectedFormDefinitionId: formDefinitionId,
                  proof: parsed.data.uploadProof,
                  secret: uploadSecret,
                });''', '''      const proof = verifyFormUploadProof({
                  expectedFormDefinitionId: formDefinitionId,
                  expectedFormVersionId: formVersionId!,
                  proof: parsed.data.uploadProof,
                  secret: uploadSecret,
                });''')
          needle = '''        verifyAssetAnswerBindings(formDefinition, formAnswers, submissionAssets);
                } catch {
                  return NextResponse.json(
                    { error: "Please upload files again before submitting." },
                    { status: 422 }
                  );
                }

              }'''
          replacement = '''        verifyAssetAnswerBindings(formDefinition, formAnswers, submissionAssets);
                } catch {
                  return NextResponse.json(
                    { error: "Please upload files again before submitting." },
                    { status: 422 }
                  );
                }

                try {
                  const consumed = await consumeFormUploadSession({
                    formDefinitionId,
                    formVersionId: formVersionId!,
                    manifestSha256: hashFormUploadManifest(proof.uploads),
                    sessionId: proof.sessionId,
                  });
                  if (!consumed) {
                    return NextResponse.json(
                      { error: "Please upload files again before submitting." },
                      { status: 422 }
                    );
                  }
                } catch {
                  return NextResponse.json(
                    { error: "File upload verification is unavailable." },
                    { status: 503 }
                  );
                }
              }'''
          if needle not in s: raise SystemExit('route marker missing')
          route.write_text(s.replace(needle, replacement))

          test = Path('src/app/api/events/[eventId]/register/route.linked-form.test.ts')
          s = test.read_text()
          s = s.replace('''  checkRateLimitForApi: vi.fn(),''', '''  checkRateLimitForApi: vi.fn(),
            consumeFormUploadSession: vi.fn(),''')
          s = s.replace('''vi.mock("@/lib/forms/upload-proof", () => ({
            validateProofBoundFormAssets: mocks.validateProofBoundFormAssets,
            verifyFormUploadProof: mocks.verifyFormUploadProof,
          }));''', '''vi.mock("@/lib/forms/upload-proof", () => ({
            hashFormUploadManifest: () => "c".repeat(64),
            validateProofBoundFormAssets: mocks.validateProofBoundFormAssets,
            verifyFormUploadProof: mocks.verifyFormUploadProof,
          }));
          vi.mock("@/lib/forms/upload-sessions", () => ({
            consumeFormUploadSession: mocks.consumeFormUploadSession,
          }));''')
          s = s.replace('''    mocks.checkRateLimitForApi.mockResolvedValue({ success: true });''', '''    mocks.checkRateLimitForApi.mockResolvedValue({ success: true });
            mocks.consumeFormUploadSession.mockResolvedValue(true);''')
          s = s.replace('''    mocks.verifyFormUploadProof.mockReturnValue({
                uploads: [''', '''    mocks.verifyFormUploadProof.mockReturnValue({
                sessionId: "33333333-3333-4333-8333-333333333333",
                uploads: [''')
          s = s.replace('''    expect(mocks.verifyFormUploadProof).toHaveBeenCalledWith({
                expectedFormDefinitionId: "00000000-0000-4000-8000-000000000002",
                proof: "proof-token",
                secret: "server-only-secret",
              });''', '''    expect(mocks.verifyFormUploadProof).toHaveBeenCalledWith({
                expectedFormDefinitionId: "00000000-0000-4000-8000-000000000002",
                expectedFormVersionId: "00000000-0000-4000-8000-000000000001",
                proof: "proof-token",
                secret: "server-only-secret",
              });''')
          needle = '''    expect(mocks.rpc).toHaveBeenCalledWith(
                "register_for_event_with_form_assets_atomic",
                expect.objectContaining({ p_assets: [asset] })
              );
            });'''
          replacement = '''    expect(mocks.consumeFormUploadSession).toHaveBeenCalledWith({
                formDefinitionId: "00000000-0000-4000-8000-000000000002",
                formVersionId: "00000000-0000-4000-8000-000000000001",
                manifestSha256: "c".repeat(64),
                sessionId: "33333333-3333-4333-8333-333333333333",
              });
              expect(mocks.rpc).toHaveBeenCalledWith(
                "register_for_event_with_form_assets_atomic",
                expect.objectContaining({ p_assets: [asset] })
              );

              mocks.rpc.mockClear();
              mocks.consumeFormUploadSession.mockResolvedValue(false);
              const replay = await POST(
                new NextRequest("https://jnuits.org.bd/api/events/event-1/register", {
                  body: JSON.stringify({
                    answers: { email: "attendee@example.test", full_name: "Event Attendee", identity_document: [uploadId] },
                    assets: [asset], captchaToken: "captcha-token", uploadProof: "proof-token",
                  }),
                  headers: { "Content-Type": "application/json" }, method: "POST",
                }),
                { params: Promise.resolve({ eventId: "event-1" }) }
              );
              expect(replay.status).toBe(422);
              expect(mocks.rpc).not.toHaveBeenCalled();
            });'''
          if needle not in s: raise SystemExit('test marker missing')
          test.write_text(s.replace(needle, replacement))
          PY
      - run: npx vitest run 'src/lib/forms/upload-signing.test.ts' 'src/lib/forms/upload-proof.test.ts' 'src/lib/forms/form-upload-session-migration.test.ts' 'src/app/api/forms/[slug]/uploads/sign/route.test.ts' 'src/app/api/forms/[slug]/submit/route.test.ts' 'src/app/api/events/[eventId]/register/route.linked-form.test.ts'
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit implementation and remove workflow
        run: |
          rm .github/workflows/apply-event-upload-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/events/'[eventId]'/register/route.ts src/app/api/events/'[eventId]'/register/route.linked-form.test.ts .github/workflows/apply-event-upload-replay.yml
          git commit -m "feat(events): reject replayed form uploads"
          git push
