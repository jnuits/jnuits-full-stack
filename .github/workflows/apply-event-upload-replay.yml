name: Apply event upload replay protection

on:
  push:
    branches: [feature/non-payment-forms-phases-2-4]
    paths: [.github/workflows/apply-event-upload-replay.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/non-payment-forms-phases-2-4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Patch event upload verification and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/events/[eventId]/register/route.ts')
          text = route.read_text()
          text = text.replace(
          '''  type FormSubmissionAsset,
            validateProofBoundFormAssets,
            verifyFormUploadProof,
          } from "@/lib/forms/upload-proof";''',
          '''  type FormSubmissionAsset,
            hashFormUploadManifest,
            validateProofBoundFormAssets,
            verifyFormUploadProof,
          } from "@/lib/forms/upload-proof";
          import { consumeFormUploadSession } from "@/lib/forms/upload-sessions";''')
          text = text.replace(
          '''      const proof = verifyFormUploadProof({
                  expectedFormDefinitionId: formDefinitionId,
                  proof: parsed.data.uploadProof,
                  secret: uploadSecret,
                });''',
          '''      const proof = verifyFormUploadProof({
                  expectedFormDefinitionId: formDefinitionId,
                  expectedFormVersionId: formVersionId!,
                  proof: parsed.data.uploadProof,
                  secret: uploadSecret,
                });''')
          text = text.replace(
          '''        verifyAssetAnswerBindings(formDefinition, formAnswers, submissionAssets);
                } catch {
                  return NextResponse.json(
                    { error: "Please upload files again before submitting." },
                    { status: 422 }
                  );
                }

              }''',
          '''        verifyAssetAnswerBindings(formDefinition, formAnswers, submissionAssets);
                } catch {
                  return NextResponse.json(
                    { error: "Please upload files again before submitting." },
                    { status: 422 }
                  );
                }

                try {
                  const consumed = await consumeFormUploadSession({
                    formDefinitionId,
                    formVersionId: formVersionId!,
                    manifestSha256: hashFormUploadManifest(proof.uploads),
                    sessionId: proof.sessionId,
                  });
                  if (!consumed) {
                    return NextResponse.json(
                      { error: "Please upload files again before submitting." },
                      { status: 422 }
                    );
                  }
                } catch {
                  return NextResponse.json(
                    { error: "File upload verification is unavailable." },
                    { status: 503 }
                  );
                }
              }''')
          route.write_text(text)

          test = Path('src/app/api/events/[eventId]/register/route.linked-form.test.ts')
          text = test.read_text()
          text = text.replace('''  checkRateLimitForApi: vi.fn(),''', '''  checkRateLimitForApi: vi.fn(),
            consumeFormUploadSession: vi.fn(),''')
          text = text.replace(
          '''vi.mock("@/lib/forms/upload-proof", () => ({
            validateProofBoundFormAssets: mocks.validateProofBoundFormAssets,
            verifyFormUploadProof: mocks.verifyFormUploadProof,
          }));''',
          '''vi.mock("@/lib/forms/upload-proof", () => ({
            hashFormUploadManifest: () => "c".repeat(64),
            validateProofBoundFormAssets: mocks.validateProofBoundFormAssets,
            verifyFormUploadProof: mocks.verifyFormUploadProof,
          }));
          vi.mock("@/lib/forms/upload-sessions", () => ({
            consumeFormUploadSession: mocks.consumeFormUploadSession,
          }));''')
          text = text.replace('''    mocks.checkRateLimitForApi.mockResolvedValue({ success: true });''', '''    mocks.checkRateLimitForApi.mockResolvedValue({ success: true });
            mocks.consumeFormUploadSession.mockResolvedValue(true);''')
          text = text.replace(
          '''    mocks.verifyFormUploadProof.mockReturnValue({
                uploads: [''',
          '''    mocks.verifyFormUploadProof.mockReturnValue({
                sessionId: "33333333-3333-4333-8333-333333333333",
                uploads: [''')
          text = text.replace(
          '''    expect(mocks.verifyFormUploadProof).toHaveBeenCalledWith({
                expectedFormDefinitionId: "00000000-0000-4000-8000-000000000002",
                proof: "proof-token",
                secret: "server-only-secret",
              });''',
          '''    expect(mocks.verifyFormUploadProof).toHaveBeenCalledWith({
                expectedFormDefinitionId: "00000000-0000-4000-8000-000000000002",
                expectedFormVersionId: "00000000-0000-4000-8000-000000000001",
                proof: "proof-token",
                secret: "server-only-secret",
              });''')
          marker = '''    expect(mocks.rpc).toHaveBeenCalledWith(
                "register_for_event_with_form_assets_atomic",
                expect.objectContaining({ p_assets: [asset] })
              );
            });'''
          replacement = '''    expect(mocks.consumeFormUploadSession).toHaveBeenCalledWith({
                formDefinitionId: "00000000-0000-4000-8000-000000000002",
                formVersionId: "00000000-0000-4000-8000-000000000001",
                manifestSha256: "c".repeat(64),
                sessionId: "33333333-3333-4333-8333-333333333333",
              });
              expect(mocks.rpc).toHaveBeenCalledWith(
                "register_for_event_with_form_assets_atomic",
                expect.objectContaining({ p_assets: [asset] })
              );
            });
            it("rejects replayed event upload sessions before registration", async () => {
              mocks.consumeFormUploadSession.mockResolvedValue(false);
              const uploadId = "22222222-2222-4222-8222-222222222222";
              const asset = {
                bytes: 1024,
                cloudinaryAssetId: "a".repeat(32),
                cloudinaryFolder: "jnuits/jnuits-full-stack/private/forms/form-1/session-1",
                cloudinaryPublicId: `${uploadId}.pdf`,
                cloudinaryVersion: "1234567890",
                contentType: "application/pdf",
                fieldId: "identity_document",
                resourceType: "raw",
                sha256: "b".repeat(64),
                uploadId,
              };
              mocks.loadPublishedFormByVersionId.mockResolvedValue({
                applicationBehavior: { fieldMapping: { email: "email", fullName: "full_name" } },
                definition: { fields: [
                  { id: "full_name", label: "Full name", required: true, type: "text" },
                  { id: "email", label: "Email", required: true, type: "email" },
                  { id: "identity_document", label: "Identity document", maxFiles: 1, required: true, type: "pdf" },
                ], payment: { enabled: false } },
                id: "00000000-0000-4000-8000-000000000002",
                kind: "event_registration",
                slug: "summit-registration",
                title: "Summit registration",
                versionId: "00000000-0000-4000-8000-000000000001",
              });
              mocks.verifyFormUploadProof.mockReturnValue({
                sessionId: "33333333-3333-4333-8333-333333333333",
                uploads: [{ assetFolder: asset.cloudinaryFolder, fieldId: asset.fieldId,
                  mimeType: asset.contentType, publicId: asset.cloudinaryPublicId,
                  resourceType: asset.resourceType, sha256: asset.sha256, size: asset.bytes, uploadId }],
              });
              mocks.validateProofBoundFormAssets.mockReturnValue([asset]);
              const response = await POST(new NextRequest("https://jnuits.org.bd/api/events/event-1/register", {
                body: JSON.stringify({ answers: { email: "attendee@example.test", full_name: "Event Attendee", identity_document: [uploadId] },
                  assets: [asset], captchaToken: "captcha-token", uploadProof: "proof-token" }),
                headers: { "Content-Type": "application/json" }, method: "POST",
              }), { params: Promise.resolve({ eventId: "event-1" }) });
              expect(response.status).toBe(422);
              expect(mocks.rpc).not.toHaveBeenCalled();
            });'''
          if marker not in text:
              raise SystemExit('event test marker not found')
          test.write_text(text.replace(marker, replacement))
          PY
      - run: npx vitest run 'src/lib/forms/upload-proof.test.ts' 'src/lib/forms/form-upload-session-migration.test.ts' 'src/app/api/forms/[slug]/uploads/sign/route.test.ts' 'src/app/api/forms/[slug]/submit/route.test.ts' 'src/app/api/events/[eventId]/register/route.linked-form.test.ts'
      - run: npm run typecheck
      - name: Commit implementation and remove one-shot workflow
        run: |
          rm .github/workflows/apply-event-upload-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/events/'[eventId]'/register/route.ts src/app/api/events/'[eventId]'/register/route.linked-form.test.ts .github/workflows/apply-event-upload-replay.yml
          git commit -m "feat(events): consume upload sessions once"
          git push
