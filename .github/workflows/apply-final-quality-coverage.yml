name: Capture final tracker failures

on:
  push:
    branches: [feature/non-payment-forms-phases-2-4]
    paths: [.github/workflows/apply-final-quality-coverage.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/non-payment-forms-phases-2-4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Capture failures
        run: npm test > final-tracker-validation.log 2>&1 || true
      - name: Commit diagnostics and remove workflow
        run: |
          rm .github/workflows/apply-final-quality-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-tracker-validation.log .github/workflows/apply-final-quality-coverage.yml
          git commit -m "test(forms): capture final tracker failures"
          git push
