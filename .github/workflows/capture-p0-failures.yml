name: Capture P0 failures

on:
  push:
    branches: [feature/non-payment-forms-phases-2-4]
    paths: [.github/workflows/capture-p0-failures.yml]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/non-payment-forms-phases-2-4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Capture deterministic failures
        run: |
          {
            echo '=== TYPECHECK ==='
            npm run typecheck || true
            echo '=== LINT ==='
            npm run lint || true
            echo '=== FOCUSED TESTS ==='
            npx vitest run 'src/lib/forms/upload-proof.test.ts' 'src/lib/forms/form-upload-session-migration.test.ts' 'src/app/api/forms/[slug]/uploads/sign/route.test.ts' 'src/app/api/forms/[slug]/submit/route.test.ts' || true
          } > p0-validation.log 2>&1
      - name: Commit diagnostic and remove one-shot workflow
        run: |
          rm .github/workflows/capture-p0-failures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p0-validation.log .github/workflows/capture-p0-failures.yml
          git commit -m "test(forms): capture P0 validation diagnostics"
          git push
