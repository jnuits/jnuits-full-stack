name: Semgrep CE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays at 09:37 Asia/Dhaka (03:37 UTC).
    - cron: "37 3 * * 1"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Semgrep CE scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      # Semgrep Community Edition 1.180.0; immutable multi-platform image.
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan first-party source
        id: scan
        shell: sh
        run: |
          mkdir -p artifacts/reports
          # Findings are informational until triaged. Engine/configuration
          # failures remain blocking; never mask the scanner's exit status.
          semgrep scan --oss-only \
            --config p/security-audit --config p/nodejs \
            --config p/typescript --config p/github-actions \
            --metrics off --disable-version-check \
            --sarif-output artifacts/reports/semgrep.sarif \
            --json-output artifacts/reports/semgrep.json .
          python - <<'PY'
          import json, os
          from pathlib import Path

          report = json.loads(Path('artifacts/reports/semgrep.json').read_text())
          errors = report.get('errors', [])
          def kind(error):
              value = error.get('type')
              return value[0] if isinstance(value, list) and value else value
          partial = [e for e in errors if e.get('level') == 'warn' and kind(e) == 'PartialParsing']
          fatal = [e for e in errors if e not in partial]
          files = sorted({span['file'] for e in partial for span in e.get('spans', []) if 'file' in span})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Semgrep CE coverage\n\n')
              summary.write(f"Scanned files: {len(report.get('paths', {}).get('scanned', []))}. Findings: {len(report.get('results', []))}. Partial-parser warnings: {len(partial)}. Engine errors: {len(fatal)}.\n\n")
              for file in files:
                  summary.write(f'- Partial parsing: `{file}`; see the JSON/SARIF artifact.\n')
          if partial:
              print(f'::warning::Semgrep reported {len(partial)} partial-parser warnings; coverage gaps remain visible in the summary and artifacts. CodeQL remains enabled.')
          if fatal:
              raise SystemExit(f'Semgrep reported {len(fatal)} engine errors; scan cannot pass.')
          PY

      - name: Publish GitHub code scanning results
        if: >-
          success() &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: artifacts/reports/semgrep.sarif
          category: semgrep-ce

      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-ce-results
          path: |
            artifacts/reports/semgrep.sarif
            artifacts/reports/semgrep.json
          if-no-files-found: warn
          retention-days: 14
