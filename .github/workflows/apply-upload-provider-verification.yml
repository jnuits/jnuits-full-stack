name: Apply tested upload provider verification

on:
  push:
    branches: [feature/non-payment-forms-phases-2-4]
    paths: [.github/workflows/apply-upload-provider-verification.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/non-payment-forms-phases-2-4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Apply provider verification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          form_route = Path('src/app/api/forms/[slug]/submit/route.ts')
          text = form_route.read_text()
          marker = 'import { buildFormConfirmationUrl, createFormConfirmation } from "@/lib/forms/confirmation";\n'
          addition = marker + 'import { verifyCloudinaryFormAssets } from "@/lib/forms/cloudinary-assets";\n'
          if 'verifyCloudinaryFormAssets' not in text:
              if marker not in text: raise SystemExit('form import marker missing')
              text = text.replace(marker, addition)
          marker = '      verifyAssetAnswerBindings(form.definition, answers, submissionAssets);\n'
          addition = marker + '      await verifyCloudinaryFormAssets(submissionAssets, { expectedFormDefinitionId: form.id, expectedFormVersionId: form.versionId });\n'
          if addition not in text:
              if marker not in text: raise SystemExit('form verification marker missing')
              text = text.replace(marker, addition)
          form_route.write_text(text)

          event_route = Path('src/app/api/events/[eventId]/register/route.ts')
          text = event_route.read_text()
          marker = 'import { loadPublishedFormByVersionId } from "@/lib/forms/repository";\n'
          addition = marker + 'import { verifyCloudinaryFormAssets } from "@/lib/forms/cloudinary-assets";\n'
          if 'verifyCloudinaryFormAssets' not in text:
              if marker not in text: raise SystemExit('event import marker missing')
              text = text.replace(marker, addition)
          marker = '        verifyAssetAnswerBindings(formDefinition, formAnswers, submissionAssets);\n'
          addition = marker + '        await verifyCloudinaryFormAssets(submissionAssets, { expectedFormDefinitionId: formDefinitionId, expectedFormVersionId: formVersionId! });\n'
          if addition not in text:
              if marker not in text: raise SystemExit('event verification marker missing')
              text = text.replace(marker, addition)
          event_route.write_text(text)

          for name in [
              'src/app/api/forms/[slug]/submit/route.test.ts',
              'src/app/api/events/[eventId]/register/route.linked-form.test.ts',
          ]:
              path = Path(name)
              text = path.read_text()
              marker = 'vi.mock("@/lib/cloudinary/config"'
              mock = 'vi.mock("@/lib/forms/cloudinary-assets", () => ({ verifyCloudinaryFormAssets: vi.fn().mockResolvedValue(undefined) }));\n\n'
              if mock not in text:
                  index = text.find(marker)
                  if index < 0: raise SystemExit(f'test marker missing: {name}')
                  text = text[:index] + mock + text[index:]
              path.write_text(text)

          contract = Path('src/lib/forms/private-download-contract.test.ts')
          text = contract.read_text().replace('expect(route).toContain("loadVerifiedCloudinaryFormAsset(asset)");', 'expect(route).toContain("loadVerifiedCloudinaryFormAsset(asset, {");\n    expect(route).toContain("expectedFormVersionId: submission.form_version_id");')
          contract.write_text(text)
          PY
      - run: npx vitest run 'src/lib/forms/cloudinary-assets.test.ts' 'src/lib/forms/private-download-contract.test.ts' 'src/app/api/forms/[slug]/submit/route.test.ts' 'src/app/api/events/[eventId]/register/route.linked-form.test.ts'
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit implementation and remove workflow
        run: |
          rm .github/workflows/apply-upload-provider-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/forms/'[slug]'/submit/route.ts src/app/api/forms/'[slug]'/submit/route.test.ts src/app/api/events/'[eventId]'/register/route.ts src/app/api/events/'[eventId]'/register/route.linked-form.test.ts src/lib/forms/private-download-contract.test.ts .github/workflows/apply-upload-provider-verification.yml
          git commit -m "feat(forms): verify provider metadata before persistence"
          git push
