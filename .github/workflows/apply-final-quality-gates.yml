name: Apply final quality gates
on:
  push:
    branches: [feature/non-payment-forms-phases-2-4]
    paths: [.github/workflows/apply-final-quality-gates.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/non-payment-forms-phases-2-4
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Patch quality gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/quality-gate.yml')
          s = p.read_text()
          first = '''      - name: Checkout
                  uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

                - name: Setup Node'''
          # Normalize indentation embedded by YAML block before matching actual file text.
          first = '\n'.join(line[8:] if line.startswith('        ') else line for line in first.splitlines())
          replacement = '''      - name: Checkout
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
          with:
            fetch-depth: 0

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

      - name: Setup Node'''
          if 'Diff whitespace check' not in s:
              if first not in s: raise SystemExit('checkout marker missing')
              s = s.replace(first, replacement, 1)
          marker = '''          src/lib/forms/event-form-assets-migration.test.ts
          src/lib/notifications/resend-delivery-webhook-migration.test.ts'''
          replacement = '''          src/lib/forms/event-form-assets-migration.test.ts
          src/lib/forms/form-lifecycle-migration.test.ts
          src/lib/forms/membership-cycle-migration.test.ts
          src/lib/forms/membership-application-decisions-migration.test.ts
          src/lib/forms/alumni-onboarding-decisions-migration.test.ts
          src/lib/forms/form-upload-session-migration.test.ts
          src/lib/forms/form-platform-security-contract.test.ts
          src/lib/notifications/resend-delivery-webhook-migration.test.ts'''
          if 'src/lib/forms/form-platform-security-contract.test.ts' not in s:
              if marker not in s: raise SystemExit('migration marker missing')
              s = s.replace(marker, replacement)
          p.write_text(s)
          PY
      - run: npx vitest run 'src/lib/forms/form-platform-lifecycle-wiring.test.ts' 'src/lib/forms/form-platform-security-contract.test.ts'
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/apply-final-quality-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/quality-gate.yml .github/workflows/apply-final-quality-gates.yml
          git commit -m "ci: enforce final form security gates"
          git push
