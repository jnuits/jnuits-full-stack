name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Admin access audit
        run: npm run audit:admin-access

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build
        env:
          # CI verifies that the app compiles. Vercel production still supplies
          # real deployment secrets and is protected by scripts/validate-env.mjs.
          APP_BASE_URL: https://jnuits.org.bd
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-site-key
          RATE_LIMIT_BACKEND: supabase
          RATE_LIMIT_SECRET_SALT: ci-placeholder-rate-limit-secret-salt-000000
          SUPABASE_SECRET_KEY: ci-placeholder-supabase-secret-key
          TURNSTILE_SECRET_KEY: ci-placeholder-turnstile-secret-key
        run: npm run build
