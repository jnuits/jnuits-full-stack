name: Quality Gate

# Restored to GitHub-hosted runners on 2026-08-12 after the temporary
# self-hosted pool stopped accepting jobs and the included-minutes reset had
# passed. The verified local Supabase CLI and Gitleaks installers remain:
# authenticating downloaded executables is useful on ephemeral runners too.
# Historical operating details and the fallback decision are recorded in
# docs/operations/self-hosted-runners.md and issue #78.
# Issue #93 finding 14.1, decision 9. Deliberately NO `branches:` filter on
# pull_request, so every pull request is gated regardless of its base.
#
# `pull_request.branches` filters on the BASE branch. With `[main]` a stacked
# slice targeting another feature branch ran none of the eight shards below and
# `Required CI` never reported, which forced a choice between a readable diff
# and a verified one. It also caused a misreport: check runs attach to a commit,
# so a duplicate pull request displayed another's green checks (issue #92).
#
# An allowlist of branch prefixes is the obvious alternative and the wrong one.
# It is hand-maintained, and PR #86 deleted one of those from the application
# mapping because it had drifted -- accepting a dropdown for Department while
# rejecting the identical thing for Batch, with no runtime difference between
# them. The same rot here means a new prefix silently runs unverified. Absence
# of a filter cannot drift.
#
# This does not widen the trust boundary. `pull_request` (not
# pull_request_target) already ran untrusted head code for any pull request to
# main. The standing conditions above are what contain that, never this filter.
#
# `push` keeps its filter. Gating every push to every branch would queue eight
# shards per commit across three shared runners for no added signal, since the
# pull request already covers it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static_analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BASE_URL: https://jnuits.org.bd
      AUTH_CAPTCHA_REQUIRED: "true"
      CLOUDINARY_API_KEY: ci-placeholder-cloudinary-api-key
      CLOUDINARY_API_SECRET: ci-placeholder-cloudinary-api-secret
      CLOUDINARY_CLOUD_NAME: ci-placeholder-cloudinary-cloud
      GOOGLE_DRIVE_EXPORTS_FOLDER_ID: ci-placeholder-exports-folder
      GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL: ci@example.test
      GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-placeholder-private-key
      GOOGLE_DRIVE_SHARED_DRIVE_ID: ci-placeholder-shared-drive
      NEXT_PUBLIC_SENTRY_DSN: https://public@example.ingest.sentry.io/123
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-site-key
      PLAYWRIGHT_PORT: 3100
      RATE_LIMIT_BACKEND: supabase
      RATE_LIMIT_SECRET_SALT: ci-placeholder-rate-limit-secret-salt-000000
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: "JnUITS <no-reply@example.test>"
      RESEND_WEBHOOK_SECRET: whsec_ci_placeholder
      RETENTION_MANIFEST_SIGNING_SECRET: ci-placeholder-retention-manifest-signing-secret
      SUPABASE_SECRET_KEY: ci-placeholder-supabase-secret-key
      TURNSTILE_SECRET_KEY: ci-placeholder-turnstile-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Admin access audit
        run: npm run audit:admin-access

      - name: Admin responsive UI audit
        run: npm run audit:admin-ui

      - name: Dependency audit
        run: node scripts/check-dependency-audit.mjs

  unit_and_integration:
    name: Unit and integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_BASE_URL: https://jnuits.org.bd
      AUTH_CAPTCHA_REQUIRED: "true"
      CLOUDINARY_API_KEY: ci-placeholder-cloudinary-api-key
      CLOUDINARY_API_SECRET: ci-placeholder-cloudinary-api-secret
      CLOUDINARY_CLOUD_NAME: ci-placeholder-cloudinary-cloud
      GOOGLE_DRIVE_EXPORTS_FOLDER_ID: ci-placeholder-exports-folder
      GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL: ci@example.test
      GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-placeholder-private-key
      GOOGLE_DRIVE_SHARED_DRIVE_ID: ci-placeholder-shared-drive
      NEXT_PUBLIC_SENTRY_DSN: https://public@example.ingest.sentry.io/123
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-site-key
      PLAYWRIGHT_PORT: 3100
      RATE_LIMIT_BACKEND: supabase
      RATE_LIMIT_SECRET_SALT: ci-placeholder-rate-limit-secret-salt-000000
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: "JnUITS <no-reply@example.test>"
      RESEND_WEBHOOK_SECRET: whsec_ci_placeholder
      RETENTION_MANIFEST_SIGNING_SECRET: ci-placeholder-retention-manifest-signing-secret
      SUPABASE_SECRET_KEY: ci-placeholder-supabase-secret-key
      TURNSTILE_SECRET_KEY: ci-placeholder-turnstile-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Credential material guard
        run: npx --no-install vitest run scripts/committed-credential-material.test.mjs

      - name: Migration parity unit checks
        run: npx --no-install vitest run scripts/check-migration-parity.test.mjs

  migration_integrity:
    name: Migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration contracts
        run: >-
          npx --no-install vitest run
          scripts/check-migration-parity.test.mjs
          src/lib/retention/retention-purge-migration.test.ts
          src/lib/events/event-registration-delivery-migration.test.ts
          src/lib/forms/form-publication-compatibility-migration.test.ts
          src/lib/forms/form-draft-version-updates-migration.test.ts
          src/lib/forms/form-confirmation-resend-migration.test.ts
          src/lib/forms/event-registration-migration.test.ts
          src/lib/forms/event-form-assets-migration.test.ts
          src/lib/forms/unapplied-migration-runtime.test.ts
          src/lib/notifications/resend-delivery-webhook-migration.test.ts

  migration_runtime:
    name: Migration runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Docker preflight and reap
        uses: ./.github/actions/docker-preflight
        with:
          scratch-paths: /tmp/jnuits-migration-verify.*

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli
        with:
          version: 2.109.1

      - name: Verify unapplied migrations on disposable Supabase
        run: |
          set -o pipefail
          mkdir -p artifacts/reports
          bash supabase/verification/run-unapplied-migrations.sh |
            tee artifacts/reports/unapplied-migration-verification.log

      - name: Upload migration verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unapplied-migration-verification
          path: artifacts/reports/unapplied-migration-verification.log
          if-no-files-found: warn
          retention-days: 14

      - name: Reap after the run
        if: always()
        uses: ./.github/actions/docker-preflight
        with:
          scratch-paths: /tmp/jnuits-migration-verify.*

  # Issue #18. Offline ordering and forward-reference analysis.
  #
  # The fixture tests are blocking: they prove the checker detects every
  # failure class it claims to, including the DDL false positives that made an
  # earlier version report 198 findings.
  #
  # The repo-wide scan is blocking too, as of 2026-07-27. The verify-then-
  # promote condition in docs/operations/migration-bootstrap-and-integrity.md
  # section 4 was satisfied on this branch: a Linux run reported
  # `Inspected 95 migrations.` followed by `Migration ordering and dependency
  # check: no findings.` The step now runs --strict, so any new finding exits
  # 2, and this job is in the Required CI needs list below.
  migration_dependencies:
    name: Migration ordering and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency checker unit tests
        run: npx --no-install vitest run scripts/check-migration-dependencies.test.mjs

      - name: Migration ordering and forward-reference scan
        run: npm run migration:check-order:strict

  # Issue #18. Supported baseline replay of the entire chain on a disposable
  # local stack. GitHub-hosted jobs receive isolated VMs, so this job can run
  # alongside migration_runtime without either cleanup step touching the
  # other's containers. The defensive pre/post reaps remain harmless.
  migration_bootstrap_replay:
    name: Clean migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Docker preflight and reap
        uses: ./.github/actions/docker-preflight
        with:
          scratch-paths: ${{ github.workspace }}/.replay-scratch

      - name: Setup Supabase CLI
        uses: ./.github/actions/setup-supabase-cli
        with:
          version: 2.109.1

      - name: Replay the full chain from the supported bootstrap point
        run: |
          set -o pipefail
          mkdir -p artifacts/reports
          DB_TYPES_OUTPUT=artifacts/reports/database.types.ts \
            bash supabase/verification/run-bootstrap-replay.sh --generate-types |
            tee artifacts/reports/bootstrap-replay-verification.log
          sha256sum artifacts/reports/database.types.ts |
            tee artifacts/reports/database-types.sha256

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bootstrap-replay-verification
          path: |
            artifacts/reports/bootstrap-replay-verification.log
            artifacts/reports/database.types.ts
            artifacts/reports/database-types.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Reap after the run
        if: always()
        uses: ./.github/actions/docker-preflight
        with:
          scratch-paths: ${{ github.workspace }}/.replay-scratch

  build_and_browser:
    name: Build and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_BASE_URL: https://jnuits.org.bd
      AUTH_CAPTCHA_REQUIRED: "true"
      CLOUDINARY_API_KEY: ci-placeholder-cloudinary-api-key
      CLOUDINARY_API_SECRET: ci-placeholder-cloudinary-api-secret
      CLOUDINARY_CLOUD_NAME: ci-placeholder-cloudinary-cloud
      GOOGLE_DRIVE_EXPORTS_FOLDER_ID: ci-placeholder-exports-folder
      GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL: ci@example.test
      GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-placeholder-private-key
      GOOGLE_DRIVE_SHARED_DRIVE_ID: ci-placeholder-shared-drive
      NEXT_PUBLIC_SENTRY_DSN: https://public@example.ingest.sentry.io/123
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-placeholder-turnstile-site-key
      PLAYWRIGHT_PORT: 3100
      RATE_LIMIT_BACKEND: supabase
      RATE_LIMIT_SECRET_SALT: ci-placeholder-rate-limit-secret-salt-000000
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: "JnUITS <no-reply@example.test>"
      RESEND_WEBHOOK_SECRET: whsec_ci_placeholder
      RETENTION_MANIFEST_SIGNING_SECRET: ci-placeholder-retention-manifest-signing-secret
      SUPABASE_SECRET_KEY: ci-placeholder-supabase-secret-key
      TURNSTILE_SECRET_KEY: ci-placeholder-turnstile-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Playwright Chromium smoke
        run: npm run test:e2e:ci

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  application_quality:
    name: Required CI
    needs:
      [
        static_analysis,
        unit_and_integration,
        migration_integrity,
        migration_runtime,
        migration_dependencies,
        migration_bootstrap_replay,
        build_and_browser,
        secret_scan,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality shard to pass
        env:
          STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
          UNIT_AND_INTEGRATION_RESULT: ${{ needs.unit_and_integration.result }}
          MIGRATION_INTEGRITY_RESULT: ${{ needs.migration_integrity.result }}
          MIGRATION_RUNTIME_RESULT: ${{ needs.migration_runtime.result }}
          MIGRATION_DEPENDENCIES_RESULT: ${{ needs.migration_dependencies.result }}
          MIGRATION_BOOTSTRAP_REPLAY_RESULT: ${{ needs.migration_bootstrap_replay.result }}
          BUILD_AND_BROWSER_RESULT: ${{ needs.build_and_browser.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
        run: |
          echo "static_analysis=$STATIC_ANALYSIS_RESULT"
          echo "unit_and_integration=$UNIT_AND_INTEGRATION_RESULT"
          echo "migration_integrity=$MIGRATION_INTEGRITY_RESULT"
          echo "migration_runtime=$MIGRATION_RUNTIME_RESULT"
          echo "migration_dependencies=$MIGRATION_DEPENDENCIES_RESULT"
          echo "migration_bootstrap_replay=$MIGRATION_BOOTSTRAP_REPLAY_RESULT"
          echo "build_and_browser=$BUILD_AND_BROWSER_RESULT"
          echo "secret_scan=$SECRET_SCAN_RESULT"
          test "$STATIC_ANALYSIS_RESULT" = "success"
          test "$UNIT_AND_INTEGRATION_RESULT" = "success"
          test "$MIGRATION_INTEGRITY_RESULT" = "success"
          test "$MIGRATION_RUNTIME_RESULT" = "success"
          test "$MIGRATION_DEPENDENCIES_RESULT" = "success"
          test "$MIGRATION_BOOTSTRAP_REPLAY_RESULT" = "success"
          test "$BUILD_AND_BROWSER_RESULT" = "success"
          case "$SECRET_SCAN_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  secret_scan:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Gitleaks
        uses: ./.github/actions/setup-gitleaks
        with:
          version: 8.24.3

      - name: Scan committed history
        run: gitleaks git --redact=100 --verbose --log-opts="--all" .
