name: Production Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: false

jobs:
  require-main:
    name: Verify trusted ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production readiness must run from main."
            exit 1
          }

  configuration-rbac-and-runtime:
    name: Configuration, RBAC, and runtime
    needs: require-main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production deployment configuration
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          AUTH_CAPTCHA_REQUIRED: ${{ vars.AUTH_CAPTCHA_REQUIRED }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          RATE_LIMIT_BACKEND: ${{ vars.RATE_LIMIT_BACKEND }}
          RATE_LIMIT_SECRET_SALT: ${{ secrets.RATE_LIMIT_SECRET_SALT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: node scripts/validate-env.mjs --production

      - name: Audit admin access map
        run: npm run audit:admin-access

      - name: Audit responsive admin patterns
        run: npm run audit:admin-ui

      - name: Audit production dependencies
        run: npm audit --audit-level=moderate

      - name: Require production application URL
        env:
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: |
          test -n "$PRODUCTION_APP_URL" || {
            echo "PRODUCTION_APP_URL is required."
            exit 1
          }

      - name: Run production runtime probe
        env:
          RUNTIME_PROBE_BASE_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: npm run test:runtime-probe

  database-parity-and-security:
    name: Read-only database parity and security evidence
    needs: configuration-rbac-and-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Initialize Supabase CLI workspace
        run: supabase init

      - name: Link protected production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "SUPABASE_PROJECT_REF is required."
            exit 1
          }
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify migration parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run migration:check

      - name: Verify admin invitation search schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:verify-admin-invite-search

      - name: Collect metadata-only Supabase cleanup evidence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:audit-cleanup

      - name: Upload database readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-database-readiness-${{ github.run_id }}
          path: artifacts/reports/supabase-cleanup-audit-*.md
          if-no-files-found: ignore
          retention-days: 30
