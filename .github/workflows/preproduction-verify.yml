name: Pre-production Verification

on:
  workflow_dispatch:
    inputs:
      run_authenticated_e2e:
        description: Run credential-backed browser checks after the CAPTCHA test strategy is configured.
        required: true
        default: false
        type: boolean
      run_event_registration_concurrency:
        description: Run destructive synthetic event-capacity checks after pending migrations are applied to isolated pre-production.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: preproduction-verification
  cancel-in-progress: false

jobs:
  require-main:
    name: Verify trusted ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Pre-production verification must run from main."
            exit 1
          }

  database-readiness:
    name: Database parity and concurrency
    needs: require-main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preproduction
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Initialize Supabase CLI workspace
        run: supabase init

      - name: Link protected pre-production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.PREPRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "PREPRODUCTION_SUPABASE_PROJECT_REF is required."
            exit 1
          }
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify migration parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run migration:check

      - name: Verify admin invitation search schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:verify-admin-invite-search

      - name: Verify event registration concurrency and capacity
        if: inputs.run_event_registration_concurrency
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.PREPRODUCTION_SUPABASE_URL }}
          PREPRODUCTION_CONCURRENCY_TESTS: "1"
          SUPABASE_SECRET_KEY: ${{ secrets.PREPRODUCTION_SUPABASE_SECRET_KEY }}
        run: npm run events:verify-concurrency

  browser-and-runtime:
    name: Browser and runtime smoke
    needs: require-main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: preproduction
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: npm

      - name: Require pre-production application URL
        env:
          PREPRODUCTION_APP_URL: ${{ vars.PREPRODUCTION_APP_URL }}
        run: |
          test -n "$PREPRODUCTION_APP_URL" || {
            echo "PREPRODUCTION_APP_URL is required."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Run public browser smoke against pre-production
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PREPRODUCTION_APP_URL }}
        run: npm run test:e2e

      - name: Run authenticated browser smoke against pre-production
        if: inputs.run_authenticated_e2e
        env:
          E2E_ALUMNI_MEMBER_EMAIL: ${{ secrets.E2E_ALUMNI_MEMBER_EMAIL }}
          E2E_ALUMNI_MEMBER_PASSWORD: ${{ secrets.E2E_ALUMNI_MEMBER_PASSWORD }}
          E2E_AUTH_SMOKE: "1"
          E2E_CONTENT_ADMIN_EMAIL: ${{ secrets.E2E_CONTENT_ADMIN_EMAIL }}
          E2E_CONTENT_ADMIN_PASSWORD: ${{ secrets.E2E_CONTENT_ADMIN_PASSWORD }}
          E2E_CURRENT_MEMBER_EMAIL: ${{ secrets.E2E_CURRENT_MEMBER_EMAIL }}
          E2E_CURRENT_MEMBER_PASSWORD: ${{ secrets.E2E_CURRENT_MEMBER_PASSWORD }}
          E2E_NORMAL_ADMIN_EMAIL: ${{ secrets.E2E_NORMAL_ADMIN_EMAIL }}
          E2E_NORMAL_ADMIN_PASSWORD: ${{ secrets.E2E_NORMAL_ADMIN_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PREPRODUCTION_APP_URL }}
        run: npm run test:e2e:auth

      - name: Run protected alumni decision workflow
        if: inputs.run_authenticated_e2e
        env:
          E2E_ALUMNI_APPROVE_CASE_ID: ${{ vars.E2E_ALUMNI_APPROVE_CASE_ID }}
          E2E_ALUMNI_EXPECTED_JNUITS_ID: ${{ vars.E2E_ALUMNI_EXPECTED_JNUITS_ID }}
          E2E_ALUMNI_REJECT_CASE_ID: ${{ vars.E2E_ALUMNI_REJECT_CASE_ID }}
          E2E_ALUMNI_WORKFLOW: "1"
          E2E_AUTH_SMOKE: "1"
          E2E_NORMAL_ADMIN_EMAIL: ${{ secrets.E2E_NORMAL_ADMIN_EMAIL }}
          E2E_NORMAL_ADMIN_PASSWORD: ${{ secrets.E2E_NORMAL_ADMIN_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PREPRODUCTION_APP_URL }}
        run: npx playwright test e2e/alumni-onboarding-protected.spec.ts --project=chromium

      - name: Run pre-production runtime probe
        env:
          RUNTIME_PROBE_BASE_URL: ${{ vars.PREPRODUCTION_APP_URL }}
        run: npm run test:runtime-probe

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preproduction-playwright-results-${{ github.run_id }}
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
